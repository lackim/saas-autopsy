name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    # npm requires the package to exist before a trusted publisher can be added.
    # v0.2.0 was the one-time local bootstrap publish; every later tag uses OIDC.
    if: github.ref_name != 'v0.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: mkdir -p release-artifact && npm pack --pack-destination release-artifact
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Set up npm for trusted publishing
        run: npm install --global --ignore-scripts npm@11.15.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: release-artifact
      - run: npm publish ./release-artifact/*.tgz --access public
      - name: Verify published version and provenance
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            PUBLISHED_VERSION="$(npm view "saas-autopsy@$VERSION" version 2>/dev/null || true)"
            PREDICATE_TYPE="$(npm view "saas-autopsy@$VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)"

            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$PREDICATE_TYPE" = "https://slsa.dev/provenance/v1" ]; then
              exit 0
            fi

            echo "Waiting for npm registry propagation (attempt $attempt/12)..."
            sleep 10
          done

          echo "Published package or provenance did not become visible in time." >&2
          exit 1
